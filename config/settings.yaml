# AI Output Auditor — runtime tunables.
#
# Document 3 treats thresholds and weights as deployment configuration; the
# reasoning rules themselves are fixed in code. Document 4 §4 designates this
# file as the single source of tunables served by the Configuration Manager.
#
# Nothing in this file changes frozen behavior. It only parameterizes it.

version: "1.0"

llm:
  # Active provider. See backend/app/shared/llm_providers/ for the abstraction.
  # Override with LLM_PROVIDER / LLM_MODEL in .env — the environment wins.
  #
  # A paid provider (OpenRouter) is written and ships commented out in
  # llm_providers/registry.py. To switch: uncomment the PAID PROVIDER blocks
  # there, then set LLM_PROVIDER=openrouter and an OpenRouter-qualified
  # LLM_MODEL, and clear reasoning_format below (it is Groq-specific).
  provider: "groq"
  # Groq retired qwen/qwen3-32b — completions 404 with "model does not exist or
  # you do not have access to it", degrading every dimension. llama-3.3-70b-
  # versatile is available on the current free tier, non-reasoning (so no
  # reasoning params below, no wasted reasoning tokens, no json_object 400s), and
  # has a 12000 TPM budget — double qwen's old 6000. Startup validation
  # (ServiceContainer.verify_model) now fails fast if this id is not served, and
  # GET /health reports llm_model_available. Overridden by LLM_MODEL in .env.
  model: "llama-3.3-70b-versatile"
  temperature: 0.0

  # Groq reserves the full max_tokens against its tokens-per-minute (TPM) budget
  # at admission — a request "costs" prompt_tokens + max_tokens whether or not
  # the model uses them, and in json_object mode a completion that hits the
  # ceiling before the JSON closes is rejected outright (HTTP 400, "Failed to
  # validate JSON"). With reasoning_effort disabled below, the engine stages
  # emit small structured JSON (measured: ~325 completion tokens for claim
  # extraction on the full trial output), so 1024 is ~3x headroom while keeping
  # the per-request reservation honest for the pacing limiter. 4096 (the old
  # value) reserved ~4x the tokens ever produced and, with six engines firing in
  # wave 1, blew the free-tier 6000 TPM on the first burst — 429s that degraded a
  # semi-random subset of dimensions to "Unable to Verify". Raise this only if a
  # stage truncates on a very large input (finish_reason=length, or a repeated
  # "Failed to validate JSON" 400, in the logs).
  max_tokens: 1024

  # Client-side TPM pacing. Held well below the model's free-tier ceiling (12000
  # for llama-3.3-70b-versatile, per Groq's x-ratelimit-limit-tokens header) so
  # the six-engine wave-1 burst plus prompt-estimate error still lands under the
  # limit. Riding the edge (11000) let bursts touch the ceiling and drew
  # 429s with inflated retry-after; 9000 leaves a ~3000-token cushion. 0
  # disables pacing. See LLMSettings.tokens_per_minute.
  tokens_per_minute: 9000

  # Cap on how long a provider-supplied Retry-After is honored. Groq's token
  # limit resets every minute (x-ratelimit-reset-tokens is sub-second to ~60s),
  # but under a concurrent burst it can return a Retry-After of many minutes —
  # longer than an engine's whole budget, so honoring it verbatim guarantees a
  # timeout and a degraded dimension for a limit that has already cleared.
  # Capping the wait at one reset window lets the retry actually land. 0 honors
  # Retry-After verbatim (the default, for providers whose value is exact).
  retry_after_cap_seconds: 45

  timeout_seconds: 60
  max_retries: 3
  retry_backoff_seconds: 1.5

  # Groq reasoning-model parameters. BOTH must be null for llama-3.3-70b-
  # versatile: it is not a reasoning model and returns HTTP 400 ("reasoning_
  # format is not supported with this model") if either is sent. They are kept
  # here, documented, for a fast switch back to a reasoning model:
  #   - reasoning_format "hidden" suppresses a <think> block that would corrupt
  #     the structured JSON the pipelines parse.
  #   - reasoning_effort "none" disables the chain-of-thought outright — on
  #     qwen3 that thinking was generated, charged to the TPM budget, then
  #     discarded by "hidden", so ~5x the token cost of the answer for nothing.
  # e.g. for qwen/qwen3.6-27b (the closest successor, 8000 TPM) set
  # reasoning_format: "hidden" and reasoning_effort: "none".
  reasoning_format: null
  reasoning_effort: null

embedding:
  provider: "local"
  model: "all-MiniLM-L6-v2"
  batch_size: 32

  # Shared embedding cache (Document 4, §12 names caching embeddings as a
  # reliability measure). Application-scoped, so Relevance and Novelty share
  # one entry for the same text rather than each paying to embed it.
  cache_enabled: true
  cache_max_entries: 20000

# Local NLI cross-encoder (AI Output Auditor, MB1). The backbone of the new
# evaluation pipeline's Layer 1 and Attribution: it labels a (premise,
# hypothesis) pair entailed / neutral / contradicted on CPU at zero token cost.
# Same dependency class as the embedding model (sentence-transformers / torch,
# already installed) — no new package. Loaded lazily; the first load downloads
# ~180MB into the local Hugging Face cache. Consumed by metrics in MB2+.
nli:
  provider: "local"
  model: "cross-encoder/nli-deberta-v3-base"

  # Softmax-probability floor the entailment class must clear before the service
  # returns SUPPORTED; below it a top-entailment pair is reported NEUTRAL. This
  # is the precision/recall dial for "supported" — a printed number, calibrated
  # against real pairs in a later milestone, not guessed here.
  entail_threshold: 0.5
  batch_size: 32

  # Load the model at startup so /health reports nli_ready immediately. Non-fatal
  # on failure (offline with no cached model): the app still boots and reports
  # nli_ready: false, matching the graceful-degradation policy used elsewhere.
  warm_on_startup: true

# Bounds for the new {source, outputs[]} audit input contract (MB1). One
# mandatory source article is audited against one or more outputs; this caps the
# fan-out per request.
input:
  max_outputs: 10

# Attribution substrate (AI Output Auditor, MB2). Per output claim: retrieve
# top-k candidate source spans, run local NLI over each (source-span, claim)
# pair, aggregate SummaC-style. top_k too low -> false "Not Found"; the
# contradiction floor governs when a claim is called a contradiction (which
# gates the verdict), so it is deliberately not tiny. The entailment floor for
# "supported" is shared with nli.entail_threshold above.
attribution:
  top_k: 5
  contradiction_threshold: 0.5
  max_claims: 80

# Factual & Numeric Accuracy (AI Output Auditor, MB2) — fully deterministic.
# Figures/dates/percentages/quantities are extracted from source and output; an
# output value that conflicts with a context-aligned source value is a Numeric
# Error. No model in the loop.
numeric:
  # Relative difference below which values are equal (defensible rounding).
  rounding_tolerance: 0.005
  # Minimum sentence token overlap for two values to be "about the same fact".
  context_overlap_min: 0.18
  # Relative difference at/above which a mismatch escalates MAJOR -> CRITICAL.
  major_relative_difference: 0.10

# Coverage evaluator (AI Output Auditor, MB3). Derived from the MB2 attribution
# map — no new retrieval or NLI. Held separately from engines.coverage (legacy)
# so the new pipeline never reaches into the legacy one.
coverage:
  # Salience floor at which a missing key point becomes a Missing-Critical-Fact
  # finding; below it an omission is a score effect (protects summarization).
  critical_omission_salience: 0.70
  partial_credit: 0.5
  # Salience at/above which a missing critical fact is CRITICAL not MAJOR.
  critical_severity_salience: 0.85

# Meaning Preservation evaluator (MB3). Holistic distortion derived from the
# MB2/MB3 signals (attribution contradictions + salient coverage loss); no LLM.
meaning:
  # Penalty per source-contradicting output claim (a reversal distorts meaning).
  contradiction_penalty: 0.30
  # Penalty per dropped high-salience key point (lost essential context).
  context_loss_penalty: 0.10

# Bias / Objectivity evaluator (MB3). Measured relative to the source: loaded or
# subjective language in the output that is absent from the source is introduced
# slant.
bias:
  term_penalty: 0.08
  max_penalty: 0.6

# Layered Decision Engine (AI Output Auditor, MB4). Parameterizes the frozen
# non-compensatory decision flow (Evaluation Framework §6): Layer 1 grounding
# gates, Layer 2 partial gating, Layer 3 compensatory. Held separately from the
# legacy `decision` block below so the new pipeline never touches the legacy one.
verdict:
  # Compensatory quality-score bands (used only when no gate lowers the verdict).
  excellent_band: 0.85
  good_band: 0.65
  # Minimum Layer-1 confidence to assert a verdict; below it, absent a definite
  # grounding failure, the run resolves to Unable to Verify.
  min_grounding_confidence: 0.60
  # Per-metric weights for the compensatory (Layer-2/3) quality score. Unlisted
  # metrics weight 1.0; inapplicable metrics are excluded entirely.
  quality_weights:
    Coverage: 1.0
    Meaning Preservation: 1.0
    Compression Quality: 0.5
    Readability & Coherence: 0.75
    Structure & Organization: 0.5
    Conciseness / Non-Redundancy: 0.5
    Bias / Objectivity: 0.75

retrieval:
  fetch_timeout_seconds: 20
  max_retries: 2
  chunk_size: 800
  chunk_overlap: 120
  top_k: 5
  external_retrieval_enabled: false

prompts:
  directory: "config/prompts"
  strict_rendering: true

# Reused deterministic-analysis tunables (AI Output Auditor). Only the two the
# new pipeline consumes: the Readability evaluator reuses `readability`
# (heuristic bounds) and the Conciseness evaluator reuses `novelty` (the
# measured redundancy thresholds — do not revert the 0.60 semantic threshold).
engines:
  readability:
    # Heuristic bounds for the Deterministic Analysis stage (Document 2, §7.6
    # stage 2). Exceeding one is a MEASUREMENT, not a verdict: the stage 3 LLM
    # review decides what it means with the sentence in front of it, and the
    # score weights that review 3:1 over these. A long sentence a reader parses
    # on the first pass is clear, and no bound here can say otherwise.
    max_mean_sentence_words: 25.0
    max_sentence_words: 45.0

    # Flesch reading-ease floor. Set low on purpose: technical content is
    # legitimately dense, and a stricter floor would flag every engineering
    # document as unreadable for being about engineering.
    min_reading_ease: 30.0
    max_grade_level: 14.0
    max_paragraph_words: 150.0

    # Below this word count, the absence of headings or lists is not worth
    # reporting — a short answer needs no navigation, and faulting it for
    # having none would fault it for being short.
    structure_required_above_words: 400.0

    # Below this, the output is too short to assess for coherence or structure
    # (they are properties of how parts relate, and there are no parts). The
    # engine reports a neutral score with low confidence rather than a verdict
    # it could not reach.
    min_words_for_review: 25
    words_for_full_confidence: 150
    expected_check_count: 8

  novelty:
    # Relatedness above which two segments become a redundancy CANDIDATE — not
    # a finding. Stage 6's review decides whether the repetition earns its
    # place, because a summary and a padded restatement look identical here.
    #
    # Same raw-cosine scale as accuracy.evidence_similarity_threshold. Rescaling
    # would compress every pair into [0.5,0.9] and make this fire on everything.
    #
    # MEASURED on all-MiniLM-L6-v2, not guessed: genuine padded restatement
    # scores 0.66-0.94, a genuine summary recap 0.72, and sentences that merely
    # share a topic 0.56 and below. The separation sits at ~0.60. An earlier
    # 0.75 default missed both the 0.66 padding and the 0.72 recap — and
    # missing the recap silently disabled the Coverage cross-check, since a
    # passage that is never a candidate can never be rescued.
    semantic_threshold: 0.60

    # Token-overlap floor for a literal duplicate — catches a near-verbatim
    # repeat differing by an article, which exact matching would miss.
    literal_threshold: 0.85

    min_segment_words: 5
    max_candidates: 25

    # The Coverage cross-check (stage 7). A confirmed-redundant segment that
    # restates a salient key point Coverage found present is rescued as
    # functional repetition — otherwise Novelty would tell the writer to delete
    # the sentence Coverage rewards them for including, and the two engines
    # would issue opposite instructions about the same text.
    #
    # The match threshold sits below semantic_threshold on purpose: a recap
    # paraphrases a key point rather than echoing it, so demanding near-identity
    # would defeat the rescue.
    coverage_match_threshold: 0.55
    coverage_salience_floor: 0.60

    words_for_full_confidence: 120
