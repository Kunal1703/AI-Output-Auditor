[pytest]
# Document 4 §10's test levels, each verifying a distinct guarantee.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Engines are async; every suite that touches one needs a loop.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

addopts =
    -q
    --strict-markers
    --tb=short

markers =
    unit: Shared components in isolation. LLM and network mocked.
    engines: One engine end-to-end over a scripted LLM, real everything else.
    decision: The Decision Engine over synthetic AuditResults. Pure; no IO.
    api: HTTP surface, contracts, job lifecycle.
    e2e: The full stack. Real orchestrator, real Decision Engine.
    live: Requires a real GROQ_API_KEY and network. Deselect with -m "not live".

filterwarnings =
    ignore::DeprecationWarning:pypdf.*
    ignore::UserWarning:torch.*
