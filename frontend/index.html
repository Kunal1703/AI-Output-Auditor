<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />

    <title>Veritas — AI Output Auditor</title>
    <meta
      name="description"
      content="Veritas audits AI-generated summaries and answers against their source — evidence-backed verdicts on faithfulness, accuracy, coverage, meaning, and bias, comparing human and LLM outputs side by side."
    />
    <meta name="keywords" content="AI auditor, hallucination detection, faithfulness, grounding, LLM evaluation, factuality" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Veritas — AI Output Auditor" />
    <meta
      property="og:description"
      content="Evidence-backed verdicts on AI-generated content: faithfulness, accuracy, coverage, meaning, and bias — human vs. LLM, side by side."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Veritas — AI Output Auditor" />
    <meta
      name="twitter:description"
      content="Audit AI outputs against their source with traceable evidence for every verdict."
    />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Set theme before paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('veritas-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
