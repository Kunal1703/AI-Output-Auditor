# nginx config for the auditor frontend container.
#
# Two jobs: serve the SPA, and proxy /api to the backend so the browser sees one
# origin — exactly what `vite.config.ts` does in development. Keeping the two
# environments identical in this respect means CORS behaves the same in both,
# and a bug does not appear only in the container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: /report/:auditId is a client route, not a file. Without this
    # a page reload on a report URL 404s, which is exactly the URL people share.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable hashed assets. index.html must NOT be cached, or a deploy leaves
    # browsers loading a stale document that references bundles that no longer
    # exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Mirror the Vite dev proxy: strip /api and forward to the backend service.
    # `backend` resolves via the compose network.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A full audit fans out to eight engines and many LLM calls. The
        # default 60s proxy timeout would cut the synchronous POST /audit off
        # mid-run and report a gateway error for an audit that was working.
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Uploaded documents (POST /audit/file). The backend's own ceiling is 10MB;
    # this must not be the tighter of the two, or nginx rejects a file the
    # application would have accepted and the user gets a 413 with no
    # explanation from the error contract.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
